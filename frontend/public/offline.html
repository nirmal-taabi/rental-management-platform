<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8f9f6;
        --panel: #ffffff;
        --accent: #68404b;
        --text: #252a29;
        --muted: #59615e;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .card {
        max-width: 420px;
        width: calc(100% - 2rem);
        background: var(--panel);
        border: 1px solid #e6e8e4;
        border-radius: 16px;
        box-shadow: 0 8px 24px rgba(22, 28, 26, 0.08);
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.75rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You're offline</h1>
      <p>The app will reconnect automatically when your internet connection returns.</p>
    </main>
  </body>
</html>
