version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: rental-management-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rental_management}
      MYSQL_USER: ${DB_USER:-rental_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
